$kind: http-request
url: "{{baseUrl}}/api/v1/users/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('인증 실패 코드', () => pm.expect(pm.response.json().code).to.eql('INVALID_TOKEN'));
    language: text/javascript
order: 4000
