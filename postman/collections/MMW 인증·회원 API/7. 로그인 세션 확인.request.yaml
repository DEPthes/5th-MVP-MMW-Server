$kind: http-request
url: "{{baseUrl}}/api/v1/auth/session"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('인증 상태', () => pm.expect(pm.response.json().data.authenticated).to.eql(true));
    language: text/javascript
order: 7000
