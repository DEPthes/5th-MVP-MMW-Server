$kind: http-request
url: "{{baseUrl}}/api/v1/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "loginId": "{{loginId}}",
      "email": "{{email}}",
      "password": "{{password}}",
      "passwordConfirm": "{{password}}",
      "name": "홍길동",
      "privacyAgreed": true
    }
scripts:
  - type: beforeRequest
    code: |-
      const suffix = Date.now().toString().slice(-8);
      pm.collectionVariables.set('email', `member${suffix}@example.com`);
      pm.collectionVariables.set('loginId', `user${suffix}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('응답 본문 없음', () => pm.expect(pm.response.text()).to.eql(''));
    language: text/javascript
order: 1000
