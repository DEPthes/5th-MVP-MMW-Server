server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mmw_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  docker:
    compose:
      enabled: false

logging:
  level:
    org.hibernate.SQL: debug