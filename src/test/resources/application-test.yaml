spring:
  datasource:
    url: jdbc:h2:mem:mmw;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  docker:
    compose:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn

gemini:
  api-key: test-only

gcs:
  bucket-name: test-bucket

stt:
  language-code: ko-KR
  model: latest_long
  sample-rate-hertz: 16000

tts:
  language-code: ko-KR
  voice-gender: NEUTRAL
  speaking-rate: 1.0

jwt:
  issuer: mmw-test
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000
